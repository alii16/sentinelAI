<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter","sans-serif"] } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
</head>
<body class="bg-slate-50 font-sans">
<div id="app-layout"></div>

<script>
authGuard();
renderLayout("websites");
document.getElementById("breadcrumb-title").textContent = "Website";

let currentPage = 1;
let searchQuery = "";

async function loadWebsites(page = 1, search = "") {
  const container = document.getElementById("websites-container");
  container.innerHTML = `<div class="p-6">${skeleton(5)}</div>`;
  const res = await API.websites.list(`?page=${page}&search=${encodeURIComponent(search)}&limit=10`);
  if (!res.ok) { container.innerHTML = errorState(); return; }
  const { items, total } = res.data.data;

  if (!items || items.length === 0) {
    container.innerHTML = `
      <div class="py-16 text-center">
        <div class="w-14 h-14 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i data-lucide="globe" class="w-7 h-7 text-slate-400"></i>
        </div>
        <p class="text-sm font-medium text-slate-700 mb-1">Belum ada website</p>
        <p class="text-xs text-slate-500 mb-5">Tambahkan website untuk mulai melakukan audit keamanan</p>
        <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
          <i data-lucide="plus" class="w-4 h-4"></i> Tambah Website
        </button>
      </div>`;
    lucide.createIcons(); return;
  }

  container.innerHTML = `
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-100">
          <tr>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">Nama</th>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">URL</th>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">Kategori</th>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">Status</th>
            <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide">Scan Terakhir</th>
            <th class="px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wide text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-50">
          ${items.map(w => `
            <tr class="hover:bg-slate-50 transition group">
              <td class="px-5 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 bg-slate-100 rounded-xl flex items-center justify-center shrink-0">
                    <i data-lucide="globe" class="w-3.5 h-3.5 text-slate-500"></i>
                  </div>
                  <span class="font-semibold text-slate-900">${w.name}</span>
                </div>
              </td>
              <td class="px-5 py-4 text-slate-500 text-xs">
                <a href="${w.url}" target="_blank" class="hover:text-slate-900 hover:underline flex items-center gap-1">
                  ${w.url.length > 40 ? w.url.slice(0,40)+"…" : w.url}
                  <i data-lucide="external-link" class="w-3 h-3 opacity-0 group-hover:opacity-100"></i>
                </a>
              </td>
              <td class="px-5 py-4 text-slate-500 text-xs">${w.category || "–"}</td>
              <td class="px-5 py-4">
                <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${w.status === 'active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                  ${w.status === 'active' ? 'Aktif' : 'Nonaktif'}
                </span>
              </td>
              <td class="px-5 py-4 text-slate-500 text-xs">${formatDate(w.last_scan_at)}</td>
              <td class="px-5 py-4 text-right">
                <div class="flex items-center justify-end gap-2">
                  <button onclick="startScanForWebsite(${w.id})" title="Scan"
                    class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition">
                    <i data-lucide="radar" class="w-4 h-4"></i>
                  </button>
                  <button onclick="openEditModal(${w.id}, '${w.name}', '${w.category||''}', '${w.description||''}')" title="Edit"
                    class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-amber-600 transition">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button onclick="deleteWebsite(${w.id})" title="Hapus"
                    class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-red-600 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
    ${total > 10 ? `
    <div class="flex items-center justify-between px-5 py-4 border-t border-slate-100">
      <p class="text-xs text-slate-500">Total ${total} website</p>
      <div class="flex gap-2">
        <button onclick="loadWebsites(${page-1}, '${search}')" ${page===1?"disabled":""} class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">← Sebelumnya</button>
        <button onclick="loadWebsites(${page+1}, '${search}')" ${items.length<10?"disabled":""} class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">Selanjutnya →</button>
      </div>
    </div>` : ""}
  `;
  lucide.createIcons();
}

function errorState() {
  return `<div class="py-12 text-center text-slate-400">
    <i data-lucide="alert-circle" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
    <p class="text-sm">Gagal memuat data</p>
    <button onclick="loadWebsites()" class="mt-3 text-xs text-slate-600 underline">Coba lagi</button>
  </div>`;
}

function openAddModal() {
  Swal.fire({
    title: "Tambah Website",
    html: `
      <div class="text-left space-y-3 mt-2">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nama Website <span class="text-red-500">*</span></label>
          <input id="swal-name" type="text" placeholder="Website Perusahaan" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">URL <span class="text-red-500">*</span></label>
          <input id="swal-url" type="url" placeholder="https://example.com" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Kategori</label>
          <select id="swal-category" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
            <option value="">– Pilih kategori –</option>
            <option>Perusahaan</option><option>Pemerintah</option><option>Pendidikan</option>
            <option>E-Commerce</option><option>Portofolio</option><option>Lainnya</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Deskripsi</label>
          <textarea id="swal-desc" rows="2" placeholder="Deskripsi singkat..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
        </div>
      </div>`,
    showCancelButton: true,
    confirmButtonText: "Simpan",
    cancelButtonText: "Batal",
    confirmButtonColor: "#09090B",
    cancelButtonColor: "#6b7280",
    preConfirm: async () => {
      const name = document.getElementById("swal-name").value.trim();
      const url  = document.getElementById("swal-url").value.trim();
      if (!name || !url) { Swal.showValidationMessage("Nama dan URL wajib diisi"); return false; }
      const res = await API.websites.create({ name, url, category: document.getElementById("swal-category").value, description: document.getElementById("swal-desc").value });
      if (!res.ok) { Swal.showValidationMessage(res.data.message || "Gagal menyimpan"); return false; }
      return true;
    }
  }).then(r => { if (r.isConfirmed) { toast("Website berhasil ditambahkan"); loadWebsites(currentPage, searchQuery); } });
}

function openEditModal(id, name, category, description) {
  Swal.fire({
    title: "Edit Website",
    html: `
      <div class="text-left space-y-3 mt-2">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Nama Website</label>
          <input id="swal-name" value="${name}" type="text" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Kategori</label>
          <input id="swal-category" value="${category}" type="text" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Deskripsi</label>
          <textarea id="swal-desc" rows="2" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none">${description}</textarea>
        </div>
      </div>`,
    showCancelButton: true,
    confirmButtonText: "Perbarui",
    cancelButtonText: "Batal",
    confirmButtonColor: "#09090B",
    preConfirm: async () => {
      const res = await API.websites.update(id, {
        name: document.getElementById("swal-name").value,
        category: document.getElementById("swal-category").value,
        description: document.getElementById("swal-desc").value,
      });
      if (!res.ok) { Swal.showValidationMessage(res.data.message || "Gagal memperbarui"); return false; }
      return true;
    }
  }).then(r => { if (r.isConfirmed) { toast("Website diperbarui"); loadWebsites(currentPage, searchQuery); } });
}

async function deleteWebsite(id) {
  const r = await confirm("Hapus website?", "Data website dan semua scan akan dihapus permanen.");
  if (r.isConfirmed) {
    const res = await API.websites.delete(id);
    if (res.ok || res.status === 204) { toast("Website dihapus"); loadWebsites(currentPage, searchQuery); }
    else toast(res.data.message || "Gagal menghapus", "error");
  }
}

function startScanForWebsite(id) {
  window.location.href = `../scan/index.html?website_id=${id}`;
}

// Build page content
document.getElementById("page-content").innerHTML = `
  <div class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Website</h1>
        <p class="text-sm text-slate-500">Kelola website target audit keamanan</p>
      </div>
      <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
        <i data-lucide="plus" class="w-4 h-4"></i> Tambah Website
      </button>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <!-- Toolbar -->
      <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-100">
        <div class="relative flex-1 max-w-xs">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="Cari website..." oninput="debounceSearch(this.value)"
            class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <button onclick="loadWebsites(1, document.getElementById('search-input').value)"
          class="p-2 border border-slate-200 rounded-xl hover:bg-slate-50 text-slate-500 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="websites-container"></div>
    </div>
  </div>
`;
lucide.createIcons();

let debounceTimer;
function debounceSearch(val) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { searchQuery = val; loadWebsites(1, val); }, 400);
}

loadWebsites();
</script>
</body>
</html>
