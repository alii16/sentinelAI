<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"]}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
</head>
<body class="bg-slate-50 font-sans">
  <div id="app-layout"></div>
<script>
authGuard();
renderLayout("reports");
document.getElementById("breadcrumb-title").textContent = "Laporan";

async function loadReports() {
  const c = document.getElementById("reports-container");
  c.innerHTML = `<div class="p-6">${skeleton(5)}</div>`;
  const res = await API.reports.list();
  if (!res.ok) { c.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Gagal memuat laporan</div>`; return; }
  const reports = res.data.data || [];
  if (!reports.length) {
    c.innerHTML = `<div class="py-16 text-center"><i data-lucide="file-text" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i><p class="text-sm text-slate-500">Belum ada laporan. Lakukan scan terlebih dahulu.</p><a href="../scan/index.html" class="mt-4 inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 transition"><i data-lucide="radar" class="w-4 h-4"></i>Mulai Scan</a></div>`;
    lucide.createIcons(); return;
  }
  c.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead class="bg-slate-50 border-b border-slate-100"><tr>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Laporan</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Score</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Risk</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Tanggal</th>
      <th class="px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase text-right">Unduh</th>
    </tr></thead>
    <tbody class="divide-y divide-slate-50">
    ${reports.map(r => `
      <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="window.location.href='detail.html?scan_id=${r.scan_id}'">
        <td class="px-5 py-4">
          <p class="font-semibold text-slate-900">${r.title || `Laporan #${r.id}`}</p>
          <p class="text-xs text-slate-500 mt-0.5">Scan #${r.scan_id}</p>
        </td>
        <td class="px-5 py-4">
          ${r.security_score !== null ? `<span class="font-bold ${scoreColor(r.security_score)}">${r.security_score.toFixed(1)}</span><span class="text-xs text-slate-400 ml-1">(${r.grade})</span>` : "–"}
        </td>
        <td class="px-5 py-4">${r.risk_level ? severityBadge(r.risk_level) : "–"}</td>
        <td class="px-5 py-4 text-xs text-slate-500">${formatDate(r.created_at)}</td>
        <td class="px-5 py-4 text-right" onclick="event.stopPropagation()">
          <div class="flex items-center justify-end gap-2">
            ${r.has_pdf ? `<a href="${API.reports.pdfUrl(r.id)}" target="_blank" class="p-1.5 rounded-lg bg-red-50 border border-red-200 text-red-600 hover:bg-red-100 transition" title="PDF"><i data-lucide="file-text" class="w-3.5 h-3.5"></i></a>` : ""}
            ${r.has_json ? `<a href="${API.reports.jsonUrl(r.id)}" target="_blank" class="p-1.5 rounded-lg bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 transition" title="JSON"><i data-lucide="code-2" class="w-3.5 h-3.5"></i></a>` : ""}
            ${r.has_csv ? `<a href="${API.reports.csvUrl(r.id)}" target="_blank" class="p-1.5 rounded-lg bg-green-50 border border-green-200 text-green-600 hover:bg-green-100 transition" title="CSV"><i data-lucide="table" class="w-3.5 h-3.5"></i></a>` : ""}
          </div>
        </td>
      </tr>`).join("")}
    </tbody></table></div>`;
  lucide.createIcons();
}

document.getElementById("page-content").innerHTML = `
  <div class="space-y-5">
    <div><h1 class="text-xl font-bold text-slate-900">Laporan</h1><p class="text-sm text-slate-500">Riwayat laporan audit keamanan website Anda</p></div>
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <p class="text-sm font-semibold text-slate-900">Semua Laporan</p>
        <button onclick="loadReports()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
      </div>
      <div id="reports-container"></div>
    </div>
  </div>`;
lucide.createIcons();
loadReports();
</script>
</body>
</html>
