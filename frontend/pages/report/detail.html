<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Laporan – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"]}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent; 
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @supports (scrollbar-width: thin) {
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app-layout"></div>

<script>
authGuard();
renderLayout("reports");
document.getElementById("breadcrumb-title").textContent = "Detail Laporan";

const params = new URLSearchParams(window.location.search);
const scanId = params.get("scan_id");

if (!scanId) {
  document.getElementById("page-content").innerHTML =
    `<div class="text-center py-20 text-slate-400">Scan ID tidak ditemukan</div>`;
} else {
  loadReport();
}

async function loadReport() {
  const content = document.getElementById("page-content");
  content.innerHTML = `<div class="space-y-4 max-w-5xl mx-auto">${skeleton(8)}</div>`;

  // Load all data in parallel using correct endpoints
  const [scanRes, predsRes, recsRes, websiteRes, techRes, reportRes] = await Promise.all([
    API.scans.get(scanId),
    API.ai.predictions(scanId),
    API.ai.recommendations(scanId),
    API.scans.website(scanId),
    API.reports.technologies(scanId),
    API.reports.byScan(scanId),
  ]);

  if (!scanRes.ok) {
    content.innerHTML =
      `<div class="text-center py-20 text-slate-400">Laporan tidak ditemukan</div>`;
    return;
  }

  const scan    = scanRes.data.data;
  const preds   = predsRes.data?.data  || [];
  const recs    = recsRes.data?.data   || [];
  const website = websiteRes.data?.data || {};
  const techs   = techRes.data?.data   || [];
  const report  = reportRes.data?.data || null;
  const score   = scan.security_score  || 0;
  const grade   = scan.grade           || "–";
  const reportId = report?.id;

  // Kelompokkan teknologi per kategori
  const techByCategory = {};
  techs.forEach(t => {
    const cat = t.category || "lainnya";
    if (!techByCategory[cat]) techByCategory[cat] = [];
    techByCategory[cat].push(t);
  });

  // Hitung severity distribution untuk chart
  const sevCount = { critical: 0, high: 0, medium: 0, low: 0 };
  preds.forEach(p => { if (sevCount[p.severity] !== undefined) sevCount[p.severity]++; });

  content.innerHTML = `
    <div class="max-w-5xl mx-auto space-y-5">

      <!-- ── Header ──────────────────────────────────────────── -->
      <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <i data-lucide="shield-check" class="w-5 h-5 text-slate-600"></i>
            <h1 class="text-xl font-bold text-slate-900">Laporan Audit Keamanan</h1>
          </div>
          <p class="text-sm text-slate-500">Scan #${scan.id} &nbsp;·&nbsp; ${formatDate(scan.completed_at)}</p>
        </div>

        <!-- Download buttons -->
        <div class="flex gap-2 flex-wrap">
          ${reportId && report.has_pdf ? `
            <button onclick="downloadFile(${reportId},'pdf')"
              class="flex items-center gap-1.5 px-3 py-2 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-semibold hover:bg-red-100 transition">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i> PDF
            </button>` : ""}
          ${reportId && report.has_json ? `
            <button onclick="downloadFile(${reportId},'json')"
              class="flex items-center gap-1.5 px-3 py-2 bg-blue-50 border border-blue-200 text-blue-700 rounded-xl text-xs font-semibold hover:bg-blue-100 transition">
              <i data-lucide="code-2" class="w-3.5 h-3.5"></i> JSON
            </button>` : ""}
          ${reportId && report.has_csv ? `
            <button onclick="downloadFile(${reportId},'csv')"
              class="flex items-center gap-1.5 px-3 py-2 bg-green-50 border border-green-200 text-green-700 rounded-xl text-xs font-semibold hover:bg-green-100 transition">
              <i data-lucide="table" class="w-3.5 h-3.5"></i> CSV
            </button>` : ""}
          ${!reportId ? `<span class="text-xs text-slate-400 self-center">File export belum tersedia</span>` : ""}
        </div>
      </div>

      <!-- ── Website Info Card ────────────────────────────────── -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
        <div class="flex items-start gap-4">
          <div class="w-11 h-11 bg-slate-100 rounded-xl flex items-center justify-center shrink-0">
            <i data-lucide="globe" class="w-5 h-5 text-slate-600"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-slate-900 text-base">${website.name || "Website"}</p>
            <a href="${website.url || "#"}" target="_blank"
               class="text-sm text-blue-600 hover:underline flex items-center gap-1 mt-0.5">
              ${website.url || "–"}
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
            ${website.category ? `<span class="mt-1.5 inline-block px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full text-xs">${website.category}</span>` : ""}
          </div>
        </div>
      </div>

      <!-- ── Score Card ───────────────────────────────────────── -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 mb-6">
          <div class="text-center">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Security Score</p>
            <p class="text-5xl font-bold ${scoreColor(score)}">${score.toFixed(1)}</p>
            <p class="text-xs text-slate-400 mt-1">dari 100</p>
          </div>
          <div class="text-center">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Grade</p>
            <p class="text-5xl font-bold ${gradeColor(grade)}">${grade}</p>
          </div>
          <div class="text-center">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Risk Level</p>
            <p class="text-2xl font-bold text-slate-900 mt-3">${(scan.risk_level || "–").toUpperCase()}</p>
          </div>
          <div class="text-center">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Durasi Scan</p>
            <p class="text-2xl font-bold text-slate-900 mt-3">${formatDuration(scan.duration_seconds)}</p>
          </div>
        </div>

        <!-- Score bar -->
        <div>
          <div class="flex justify-between text-xs text-slate-400 mb-1.5">
            <span>0 — Kritis</span><span>50</span><span>100 — Aman</span>
          </div>
          <div class="relative h-3 bg-gradient-to-r from-red-400 via-yellow-400 to-emerald-400 rounded-full overflow-hidden">
            <div class="absolute top-0 right-0 h-full bg-white/70 rounded-r-full transition-all duration-700"
                 style="width:${100 - score}%"></div>
            <div class="absolute top-0 h-full w-1 bg-white shadow-sm rounded-full transition-all duration-700"
                 style="left:${Math.min(score, 99)}%"></div>
          </div>
        </div>
      </div>

      <!-- ── Stats ────────────────────────────────────────────── -->
      <div class="grid grid-cols-4 gap-3">
        ${miniStat("Critical", scan.critical_count||0, "bg-red-50 border-red-200",    "text-red-700")}
        ${miniStat("High",     scan.high_count||0,     "bg-orange-50 border-orange-200","text-orange-700")}
        ${miniStat("Medium",   scan.medium_count||0,   "bg-yellow-50 border-yellow-200","text-yellow-700")}
        ${miniStat("Low",      scan.low_count||0,      "bg-green-50 border-green-200", "text-green-700")}
      </div>

      <!-- ── Scan Info ─────────────────────────────────────────── -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
        <h3 class="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="info" class="w-4 h-4 text-slate-400"></i> Informasi Scan
        </h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm">
          ${infoRow("Mode Scan",       scan.mode?.toUpperCase())}
          ${infoRow("Total Halaman",   scan.total_pages)}
          ${infoRow("Total Endpoint",  scan.total_endpoints)}
          ${infoRow("Total Temuan",    scan.total_findings)}
          ${infoRow("Dimulai",         formatDate(scan.started_at))}
          ${infoRow("Selesai",         formatDate(scan.completed_at))}
        </div>
      </div>

      <!-- ── Technologies ─────────────────────────────────────── -->
      ${techs.length > 0 ? `
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
        <h3 class="text-sm font-semibold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="cpu" class="w-4 h-4 text-slate-400"></i>
          Teknologi Terdeteksi
          <span class="ml-1 px-2 py-0.5 bg-slate-100 rounded-full text-xs text-slate-500">${techs.length}</span>
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          ${Object.entries(techByCategory).map(([cat, items]) => `
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">${techCatLabel(cat)}</p>
              <div class="space-y-1.5">
                ${items.map(t => `
                  <div class="flex items-center justify-between bg-slate-50 rounded-xl px-3 py-2">
                    <div class="flex items-center gap-2">
                      <div class="w-2 h-2 rounded-full ${t.confidence >= 80 ? 'bg-emerald-500' : t.confidence >= 50 ? 'bg-yellow-500' : 'bg-slate-400'}"></div>
                      <span class="text-sm font-medium text-slate-800">${t.name}</span>
                      ${t.version ? `<span class="text-xs text-slate-400">${t.version}</span>` : ""}
                    </div>
                    <span class="text-xs font-semibold text-slate-500">${t.confidence}%</span>
                  </div>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </div>` : ""}

      <!-- ── Findings ──────────────────────────────────────────── -->
      ${preds.length > 0 ? `
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
            <i data-lucide="triangle-alert" class="w-4 h-4 text-slate-400"></i>
            Temuan Keamanan
            <span class="ml-1 px-2 py-0.5 bg-slate-100 rounded-full text-xs text-slate-500">${preds.length}</span>
          </h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">#</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">Temuan</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">Severity</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">Confidence</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">OWASP</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase">CWE</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
              ${preds.map((p,i) => `
                <tr class="hover:bg-slate-50 transition">
                  <td class="px-5 py-3.5 text-xs text-slate-400">${i+1}</td>
                  <td class="px-5 py-3.5 font-medium text-slate-900">${p.prediction}</td>
                  <td class="px-5 py-3.5">${severityBadge(p.severity)}</td>
                  <td class="px-5 py-3.5">
                    <div class="flex items-center gap-2">
                      <div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full rounded-full transition-all ${p.confidence >= 90 ? 'bg-emerald-500' : p.confidence >= 70 ? 'bg-yellow-500' : 'bg-red-500'}"
                             style="width:${p.confidence}%"></div>
                      </div>
                      <span class="text-xs font-semibold text-slate-700">${p.confidence.toFixed(0)}%</span>
                    </div>
                  </td>
                  <td class="px-5 py-3.5 text-xs text-slate-500">${p.owasp_category || "–"}</td>
                  <td class="px-5 py-3.5 text-xs text-slate-500">${p.cwe_id || "–"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>` : `
      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 flex items-center gap-3">
        <i data-lucide="shield-check" class="w-6 h-6 text-emerald-600 shrink-0"></i>
        <div>
          <p class="text-sm font-semibold text-emerald-900">Tidak ada temuan keamanan</p>
          <p class="text-xs text-emerald-700 mt-0.5">Audit selesai tanpa temuan yang signifikan pada website ini.</p>
        </div>
      </div>`}

      <!-- ── Recommendations ───────────────────────────────────── -->
      ${recs.length > 0 ? `
      <div class="space-y-3">
        <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
          <i data-lucide="lightbulb" class="w-4 h-4 text-slate-400"></i>
          Rekomendasi Perbaikan
          <span class="ml-1 px-2 py-0.5 bg-slate-100 rounded-full text-xs text-slate-500">${recs.length}</span>
        </h3>
        ${recs.map((r,i) => `
          <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${i+1}</span>
                <div>
                  <p class="text-sm font-semibold text-slate-900">${r.title}</p>
                  <div class="flex flex-wrap items-center gap-2 mt-1">
                    ${severityBadge(r.priority)}
                    ${r.owasp_ref  ? `<span class="text-xs text-slate-400">${r.owasp_ref}</span>`  : ""}
                    ${r.cwe_ref    ? `<span class="text-xs text-slate-400">${r.cwe_ref}</span>`    : ""}
                    ${r.cvss_score ? `<span class="text-xs font-medium text-slate-500">CVSS ${r.cvss_score}</span>` : ""}
                  </div>
                </div>
              </div>
              <button onclick="toggleRec(${i})"
                      class="p-1 rounded-lg hover:bg-slate-100 text-slate-400 shrink-0 transition">
                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="rec-chevron-${i}"></i>
              </button>
            </div>
            <div id="rec-detail-${i}" class="hidden px-5 py-4 space-y-4 text-sm bg-slate-50/50">
              ${r.summary  ? `<p class="text-slate-600 italic text-xs border-l-2 border-slate-300 pl-3">${r.summary}</p>` : ""}
              ${r.cause    ? `<div><p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">📌 Penyebab</p><p class="text-slate-700">${r.cause}</p></div>` : ""}
              ${r.impact   ? `<div><p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">⚠️ Dampak</p><p class="text-slate-700">${r.impact}</p></div>` : ""}
              ${r.solution ? `<div><p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">✅ Solusi</p><p class="text-slate-700">${r.solution}</p></div>` : ""}
              ${r.checklist?.length ? `
                <div>
                  <p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">📋 Checklist Perbaikan</p>
                  <ul class="space-y-1.5">
                    ${r.checklist.map(c => `
                      <li class="flex items-start gap-2 text-slate-700">
                        <i data-lucide="circle-check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5"></i>
                        <span>${c}</span>
                      </li>`).join("")}
                  </ul>
                </div>` : ""}
              ${r.affected_url ? `
                <div>
                  <p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">🔗 URL Terpengaruh</p>
                  <p class="text-xs text-slate-500 font-mono bg-slate-100 px-3 py-2 rounded-lg break-all">${r.affected_url}</p>
                </div>` : ""}
            </div>
          </div>
        `).join("")}
      </div>` : ""}

      <!-- ── AI Chat CTA ───────────────────────────────────────── -->
      <div class="bg-slate-900 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div>
          <p class="text-white font-semibold">Punya pertanyaan tentang laporan ini?</p>
          <p class="text-slate-400 text-sm mt-0.5">Tanyakan kepada Sentinel AI Security Assistant</p>
        </div>
        <a href="../ai-chat/index.html?scan_id=${scanId}"
           class="shrink-0 flex items-center gap-2 bg-white text-slate-900 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-100 transition">
          <i data-lucide="bot" class="w-4 h-4"></i> Tanya AI
        </a>
      </div>

    </div>`;
  lucide.createIcons();
}

function miniStat(label, val, bg, text) {
  return `
    <div class="border ${bg} rounded-xl p-3 text-center">
      <p class="text-2xl font-bold ${text}">${val}</p>
      <p class="text-xs text-slate-500 font-medium mt-0.5">${label}</p>
    </div>`;
}

function infoRow(label, val) {
  return `
    <div>
      <p class="text-xs text-slate-500 mb-0.5">${label}</p>
      <p class="font-medium text-slate-900">${val ?? "–"}</p>
    </div>`;
}

function techCatLabel(cat) {
  const map = {
    framework: "Framework", cms: "CMS", server: "Server",
    library: "Library", language: "Bahasa", cdn: "CDN",
    waf: "WAF", database: "Database", other: "Lainnya", lainnya: "Lainnya"
  };
  return map[cat] || cat;
}

function toggleRec(i) {
  const el = document.getElementById(`rec-detail-${i}`);
  const ch = document.getElementById(`rec-chevron-${i}`);
  el.classList.toggle("hidden");
  ch.style.transform = el.classList.contains("hidden") ? "" : "rotate(180deg)";
}
</script>
</body>
</html>
