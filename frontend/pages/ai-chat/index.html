<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"],mono:["JetBrains Mono","monospace"]}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <style>
    .chat-msg { animation: fadeUp 0.3s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .typing-dot { animation: blink 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
    .prose-sm p { margin-bottom: 0.5rem; }
    .prose-sm ul { list-style: disc; padding-left: 1.2rem; margin-bottom: 0.5rem; }
    .prose-sm code { background:#f1f5f9; padding:1px 4px; border-radius:4px; font-size:0.75rem; font-family:'JetBrains Mono',monospace; }

    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent; 
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @supports (scrollbar-width: thin) {
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app-layout"></div>

<script>
authGuard();
renderLayout("ai-chat");
document.getElementById("breadcrumb-title").textContent = "AI Chat";

const params = new URLSearchParams(window.location.search);
let currentScanId = params.get("scan_id") || null;
let currentSessionId = null;
let isLoading = false;

const QUICK_PROMPTS = [
  "Mengapa website saya mendapat nilai tersebut?",
  "Temuan mana yang harus diperbaiki terlebih dahulu?",
  "Bagaimana cara memperbaiki missing security headers?",
  "Apa dampak dari SQL Injection yang ditemukan?",
  "Jelaskan rekomendasi keamanan secara singkat",
  "Bagaimana cara mengamankan session cookie?",
];

async function init() {
  // Load scans for selector
  const scansRes = await API.scans.history();
  const scans = (scansRes.data?.data || []).filter(s => s.status === "completed");

  document.getElementById("page-content").innerHTML = `
    <div class="flex gap-5 h-[calc(100vh-7rem)]">

      <!-- Sidebar: Scan Selector -->
      <div class="hidden lg:flex flex-col w-64 shrink-0 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-4 py-3.5 border-b border-slate-100">
          <p class="text-xs font-semibold text-slate-700 uppercase tracking-wide">Pilih Scan</p>
        </div>
        <div class="flex-1 overflow-y-auto p-2 space-y-1">
          ${!scans.length ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada scan selesai</p>` :
            scans.map(s => `
              <button onclick="selectScan(${s.id})" id="scan-btn-${s.id}"
                class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-slate-50 transition ${currentScanId == s.id ? 'bg-slate-100' : ''}">
                <p class="text-xs font-semibold text-slate-900">Scan #${s.id}</p>
                <p class="text-xs text-slate-400 mt-0.5">${formatDate(s.created_at)}</p>
                ${s.security_score !== null ? `<p class="text-xs font-bold ${scoreColor(s.security_score)} mt-0.5">${s.security_score.toFixed(1)} / ${s.grade}</p>` : ""}
              </button>`).join("")}
        </div>
        <div class="p-3 border-t border-slate-100">
          <button onclick="clearChat()" class="w-full text-xs text-slate-500 hover:text-slate-900 py-1.5 rounded-lg hover:bg-slate-50 transition flex items-center justify-center gap-1.5">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus Percakapan
          </button>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="flex-1 flex flex-col bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <!-- Header -->
        <div class="flex items-center gap-3 px-5 py-3.5 border-b border-slate-100">
          <div class="w-8 h-8 bg-slate-900 rounded-xl flex items-center justify-center">
            <i data-lucide="bot" class="w-4 h-4 text-white"></i>
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-900">Sentinel AI Assistant</p>
            <p class="text-xs text-slate-500" id="chat-scan-label">
              ${currentScanId ? `Menggunakan Scan #${currentScanId}` : "Pilih scan untuk memulai"}
            </p>
          </div>
          <!-- Mobile scan select -->
          <div class="ml-auto lg:hidden">
            <select onchange="selectScan(this.value)" class="text-xs border border-slate-200 rounded-xl px-2 py-1.5 focus:outline-none">
              <option value="">Pilih scan</option>
              ${scans.map(s => `<option value="${s.id}" ${currentScanId == s.id ? 'selected' : ''}>Scan #${s.id}</option>`).join("")}
            </select>
          </div>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto p-5 space-y-4" id="chat-messages">
          ${!currentScanId ? welcomeScreen() : ""}
        </div>

        <!-- Quick prompts -->
        <div id="quick-prompts" class="${currentScanId ? '' : 'hidden'} px-5 py-3 border-t border-slate-100 flex gap-2 overflow-x-auto">
          ${QUICK_PROMPTS.map(p => `
            <button onclick="sendQuick('${p}')"
              class="shrink-0 text-xs px-3 py-1.5 border border-slate-200 rounded-full text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition whitespace-nowrap">
              ${p}
            </button>`).join("")}
        </div>

        <!-- Input -->
        <div class="px-5 py-4 border-t border-slate-100">
          <div class="flex gap-3">
            <div class="flex-1 relative">
              <textarea id="chat-input" rows="2" placeholder="${currentScanId ? 'Tanyakan tentang hasil audit keamanan...' : 'Pilih scan terlebih dahulu'}"
                ${!currentScanId ? 'disabled' : ''}
                onkeydown="handleKey(event)"
                class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 resize-none focus:outline-none focus:ring-2 focus:ring-slate-900 transition disabled:bg-slate-50 disabled:cursor-not-allowed"></textarea>
            </div>
            <button onclick="sendMessage()" id="send-btn"
              ${!currentScanId ? 'disabled' : ''}
              class="self-end p-3 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition disabled:opacity-40 disabled:cursor-not-allowed">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-xs text-slate-400 mt-2">AI hanya menjawab berdasarkan data hasil audit scan yang dipilih.</p>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
  if (currentScanId) loadMessages();
}

function welcomeScreen() {
  return `
    <div class="flex flex-col items-center justify-center h-full text-center py-10">
      <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mb-4">
        <i data-lucide="bot" class="w-8 h-8 text-slate-400"></i>
      </div>
      <h3 class="text-base font-semibold text-slate-700 mb-2">Sentinel AI Security Assistant</h3>
      <p class="text-sm text-slate-400 max-w-sm">Pilih scan yang telah selesai dari panel kiri, kemudian ajukan pertanyaan tentang hasil audit keamanan website Anda.</p>
    </div>`;
}

function selectScan(id) {
  if (!id) return;
  currentScanId = id;
  currentSessionId = null;
  document.getElementById("chat-scan-label").textContent = `Menggunakan Scan #${id}`;
  document.getElementById("chat-input").disabled = false;
  document.getElementById("chat-input").placeholder = "Tanyakan tentang hasil audit keamanan...";
  document.getElementById("send-btn").disabled = false;
  document.getElementById("quick-prompts").classList.remove("hidden");
  document.querySelectorAll("[id^='scan-btn-']").forEach(b => b.classList.remove("bg-slate-100"));
  document.getElementById(`scan-btn-${id}`)?.classList.add("bg-slate-100");
  clearChat(false);
}

function clearChat(notify = true) {
  currentSessionId = null;
  document.getElementById("chat-messages").innerHTML = currentScanId ? "" : welcomeScreen();
  if (notify) lucide.createIcons();
}

function loadMessages() {
  appendBotMessage("Halo! Saya siap membantu menganalisis hasil audit keamanan website Anda. Silakan ajukan pertanyaan Anda.");
}

function sendQuick(text) {
  document.getElementById("chat-input").value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  if (isLoading || !currentScanId) return;
  const input = document.getElementById("chat-input");
  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  appendUserMessage(message);
  showTyping();
  isLoading = true;
  document.getElementById("send-btn").disabled = true;

  const res = await API.ai.chat({ scan_id: parseInt(currentScanId), message, session_id: currentSessionId });
  removeTyping();
  isLoading = false;
  document.getElementById("send-btn").disabled = false;

  if (res.ok && res.data.data) {
    currentSessionId = res.data.data.session_id;
    appendBotMessage(res.data.data.answer);
  } else {
    appendBotMessage("Maaf, terjadi kesalahan saat memproses pertanyaan Anda. Silakan coba lagi.");
  }
}

function appendUserMessage(text) {
  const box = document.getElementById("chat-messages");
  box.innerHTML += `
    <div class="flex justify-end chat-msg">
      <div class="max-w-[80%] bg-slate-900 text-white rounded-2xl rounded-br-sm px-4 py-3 text-sm leading-relaxed">
        ${escapeHtml(text)}
      </div>
    </div>`;
  box.scrollTop = box.scrollHeight;
}

function appendBotMessage(text) {
  const box = document.getElementById("chat-messages");
  const html = typeof marked !== 'undefined' ? marked.parse(text) : escapeHtml(text).replace(/\n/g, '<br>');
  box.innerHTML += `
    <div class="flex gap-3 chat-msg">
      <div class="w-7 h-7 bg-slate-900 rounded-xl flex items-center justify-center shrink-0 mt-0.5">
        <i data-lucide="bot" class="w-3.5 h-3.5 text-white"></i>
      </div>
      <div class="max-w-[85%] bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed text-slate-800 prose-sm">
        ${html}
        <div class="flex gap-2 mt-3 pt-2 border-t border-slate-100">
          <button onclick="copyText(this, \`${text.replace(/`/g,'\\`')}\`)" class="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1 transition">
            <i data-lucide="copy" class="w-3 h-3"></i> Salin
          </button>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
  box.scrollTop = box.scrollHeight;
}

function showTyping() {
  const box = document.getElementById("chat-messages");
  box.innerHTML += `
    <div class="flex gap-3 chat-msg" id="typing-indicator">
      <div class="w-7 h-7 bg-slate-900 rounded-xl flex items-center justify-center shrink-0">
        <i data-lucide="bot" class="w-3.5 h-3.5 text-white"></i>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3">
        <p class="text-xs text-slate-500 mb-1.5">Sedang menganalisis...</p>
        <div class="flex gap-1">
          <span class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></span>
        </div>
      </div>
    </div>`;
  lucide.createIcons();
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  document.getElementById("typing-indicator")?.remove();
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Disalin`;
    lucide.createIcons();
    setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" class="w-3 h-3"></i> Salin`; lucide.createIcons(); }, 2000);
  });
}

function escapeHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

init();
</script>
</body>
</html>
