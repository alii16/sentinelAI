<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dataset – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"]}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
</head>
<body class="bg-slate-50 font-sans">
<div id="app-layout"></div>
<script>
authGuard();
renderLayout("dataset");
document.getElementById("breadcrumb-title").textContent = "Dataset";

async function loadDatasets() {
  const c = document.getElementById("ds-container");
  c.innerHTML = `<div class="p-6">${skeleton(3)}</div>`;
  const res = await API.datasets.list();
  const datasets = res.data?.data || [];
  if (!datasets.length) {
    c.innerHTML = `<div class="py-16 text-center"><i data-lucide="database" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i><p class="text-sm text-slate-500 mb-4">Belum ada dataset yang diunggah</p></div>`;
    lucide.createIcons(); return;
  }
  c.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead class="bg-slate-50 border-b border-slate-100"><tr>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Nama</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Versi</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Sampel</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Status</th>
      <th class="text-left px-5 py-3.5 text-xs font-semibold text-slate-500 uppercase">Tanggal</th>
    </tr></thead>
    <tbody class="divide-y divide-slate-50">
    ${datasets.map(d => `
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-4 font-medium text-slate-900">${d.name}</td>
        <td class="px-5 py-4 text-slate-500 text-xs">v${d.version}</td>
        <td class="px-5 py-4 text-slate-500">${d.sample_count ? d.sample_count.toLocaleString() : "–"}</td>
        <td class="px-5 py-4"><span class="px-2 py-0.5 rounded-full text-xs font-semibold ${d.status==='ready' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${d.status}</span></td>
        <td class="px-5 py-4 text-xs text-slate-500">${formatDate(d.created_at)}</td>
      </tr>`).join("")}
    </tbody></table></div>`;
  lucide.createIcons();
}

document.getElementById("page-content").innerHTML = `
  <div class="space-y-5">
    <div class="flex items-center justify-between">
      <div><h1 class="text-xl font-bold text-slate-900">Dataset</h1><p class="text-sm text-slate-500">Dataset untuk pelatihan model Machine Learning</p></div>
    </div>
    
    <!-- Info Card -->
    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-5">
      <div class="flex items-start gap-3">
        <i data-lucide="info" class="w-5 h-5 text-blue-600 shrink-0 mt-0.5"></i>
        <div>
          <p class="text-sm font-semibold text-blue-900">Tentang Dataset Sentinel AI</p>
          <p class="text-sm text-blue-700 mt-1">Dataset berisi hasil audit keamanan website yang telah diverifikasi. Setiap record mewakili satu endpoint yang dianalisis dengan label: Authentication, Authorization, Configuration, Input Validation, Session, Header, Information, Safe.</p>
          <p class="text-sm text-blue-700 mt-2">Model saat ini dilatih menggunakan dataset internal dengan akurasi rata-rata <strong>93.5%</strong>.</p>
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <p class="text-sm font-semibold text-slate-900">Dataset Tersedia</p>
        <button onclick="loadDatasets()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
      </div>
      <div id="ds-container"></div>
    </div>
  </div>`;
lucide.createIcons();
loadDatasets();
</script>
</body>
</html>
