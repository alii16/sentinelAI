<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Daftar – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","sans-serif"]}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../assets/js/api.js"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent; 
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @supports (scrollbar-width: thin) {
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="flex items-center gap-2 mb-8">
      <div class="w-8 h-8 bg-slate-900 rounded-xl flex items-center justify-center">
        <i data-lucide="shield-check" class="w-4 h-4 text-white"></i>
      </div>
      <span class="font-bold text-slate-900">Sentinel AI</span>
    </div>
    <h2 class="text-2xl font-bold text-slate-900 mb-1">Buat Akun</h2>
    <p class="text-sm text-slate-500 mb-8">Daftar untuk mulai audit keamanan website</p>
    <form id="reg-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nama Lengkap</label>
        <input type="text" id="name" placeholder="John Doe" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <input type="email" id="email" placeholder="john@example.com" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input type="password" id="password" placeholder="Min. 6 karakter" required minlength="6" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"/>
      </div>
      <button type="submit" id="reg-btn" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-800 transition disabled:opacity-50 flex items-center justify-center gap-2">
        <span id="btn-text">Daftar</span>
        <span id="btn-loader" class="hidden"><svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/></svg></span>
      </button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6">Sudah punya akun? <a href="login.html" class="font-semibold text-slate-900 hover:underline">Masuk</a></p>
  </div>
<script>
if (Auth.isLoggedIn()) window.location.href = "../../pages/dashboard/index.html";
lucide.createIcons();
document.getElementById("reg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reg-btn");
  btn.disabled = true;
  document.getElementById("btn-text").textContent = "Memproses...";
  document.getElementById("btn-loader").classList.remove("hidden");
  const res = await API.auth.register({
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  });
  btn.disabled = false;
  document.getElementById("btn-text").textContent = "Daftar";
  document.getElementById("btn-loader").classList.add("hidden");
  if (res.ok) {
    Swal.fire({ icon:"success", title:"Berhasil!", text:"Akun berhasil dibuat. Silakan masuk.", confirmButtonColor:"#09090B" })
      .then(() => window.location.href = "login.html");
  } else {
    Swal.fire({ icon:"error", title:"Gagal", text: res.data.message || "Registrasi gagal", confirmButtonColor:"#09090B" });
  }
});
</script>
</body>
</html>
