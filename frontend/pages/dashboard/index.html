<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Sentinel AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "sans-serif"] } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent; 
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @supports (scrollbar-width: thin) {
      * {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans">
<div id="app-layout"></div>

<script>
authGuard();
renderLayout("dashboard");
document.getElementById("breadcrumb-title").textContent = "Dashboard";

async function loadDashboard() {
  const content = document.getElementById("page-content");
  content.innerHTML = `<div class="space-y-6">${skeleton(6)}</div>`;

  const [statsRes, scoreRes, sevRes, actRes] = await Promise.all([
    API.dashboard.statistics(),
    API.dashboard.chartScore(),
    API.dashboard.chartSeverity(),
    API.dashboard.chartActivity(),
  ]);

  const s = statsRes.data?.data || {};
  const scoreData = scoreRes.data?.data || [];
  const sevData = sevRes.data?.data || {};
  const actData = actRes.data?.data || [];

  const lastScore = s.last_score;
  const scoreDisplay = lastScore !== null && lastScore !== undefined ? lastScore.toFixed(1) : "–";
  const lastGrade = s.last_grade || "–";
  const scoreColorClass = lastScore >= 90 ? "text-emerald-600" : lastScore >= 80 ? "text-green-600" : lastScore >= 70 ? "text-yellow-600" : lastScore >= 60 ? "text-orange-600" : lastScore !== null ? "text-red-600" : "text-slate-400";

  content.innerHTML = `
    <div class="space-y-6">
      <!-- Welcome -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <h1 class="text-xl font-bold text-slate-900">Selamat datang, ${Auth.getUser()?.name || "Pengguna"} 👋</h1>
          <p class="text-sm text-slate-500 mt-0.5">Pantau keamanan website Anda dari sini</p>
        </div>
        <a href="../scan/index.html"
          class="inline-flex items-center gap-2 bg-slate-900 text-white text-sm font-semibold px-4 py-2.5 rounded-xl hover:bg-slate-800 transition">
          <i data-lucide="radar" class="w-4 h-4"></i> Scan Baru
        </a>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        ${statCard("Security Score", scoreDisplay, lastGrade ? `Grade ${lastGrade}` : "Belum ada scan", "shield-check", scoreColorClass)}
        ${statCard("Total Website", s.website || 0, "Website terdaftar", "globe", "text-blue-600")}
        ${statCard("Total Scan", s.scan || 0, `${s.running || 0} sedang berjalan`, "radar", "text-purple-600")}
        ${statCard("Total Temuan", (s.critical||0)+(s.high||0)+(s.medium||0)+(s.low||0), `${s.critical||0} Critical`, "triangle-alert", "text-red-600")}
      </div>

      <!-- Severity Mini Cards -->
      <div class="grid grid-cols-4 gap-3">
        ${miniCard("Critical", s.critical||0, "bg-red-50 border-red-200", "text-red-700")}
        ${miniCard("High", s.high||0, "bg-orange-50 border-orange-200", "text-orange-700")}
        ${miniCard("Medium", s.medium||0, "bg-yellow-50 border-yellow-200", "text-yellow-700")}
        ${miniCard("Low", s.low||0, "bg-green-50 border-green-200", "text-green-700")}
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Score Trend -->
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
          <p class="text-sm font-semibold text-slate-900 mb-4">Tren Security Score</p>
          ${scoreData.length > 0 ? '<canvas id="scoreChart" class="max-h-56"></canvas>' : emptyState("Belum ada data scan", "radar")}
        </div>
        <!-- Severity Distribution -->
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
          <p class="text-sm font-semibold text-slate-900 mb-4">Distribusi Temuan</p>
          ${(sevData.critical||sevData.high||sevData.medium||sevData.low) ? '<canvas id="sevChart" class="max-h-56"></canvas>' : emptyState("Belum ada temuan", "shield")}
        </div>
      </div>

      <!-- Recent Scans -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <p class="text-sm font-semibold text-slate-900">Scan Terbaru</p>
          <a href="../scan/history.html" class="text-xs text-slate-500 hover:text-slate-900 font-medium">Lihat semua →</a>
        </div>
        <div id="recent-scans-table">
          <div class="p-5">${skeleton(3)}</div>
        </div>
      </div>
    </div>
  `;

  lucide.createIcons();

  // Score chart
  if (scoreData.length > 0) {
    new Chart(document.getElementById("scoreChart"), {
      type: "line",
      data: {
        labels: scoreData.map(d => d.date),
        datasets: [{
          label: "Security Score",
          data: scoreData.map(d => d.score),
          borderColor: "#09090B",
          backgroundColor: "rgba(9,9,11,0.05)",
          tension: 0.4,
          fill: true,
          pointBackgroundColor: "#09090B",
          pointRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 0, max: 100, grid: { color: "#f1f5f9" }, ticks: { font: { size: 10 } } },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        }
      }
    });
  }

  // Severity chart
  if (sevData.critical || sevData.high || sevData.medium || sevData.low) {
    new Chart(document.getElementById("sevChart"), {
      type: "doughnut",
      data: {
        labels: ["Critical", "High", "Medium", "Low"],
        datasets: [{
          data: [sevData.critical||0, sevData.high||0, sevData.medium||0, sevData.low||0],
          backgroundColor: ["#ef4444","#f97316","#f59e0b","#10b981"],
          borderWidth: 0,
          hoverOffset: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: {
          legend: { position: "right", labels: { font: { size: 11 }, padding: 12 } }
        },
        cutout: "65%",
      }
    });
  }

  // Recent scans
  const histRes = await API.scans.history();
  const scans = histRes.data?.data || [];
  const table = document.getElementById("recent-scans-table");
  if (!scans.length) {
    table.innerHTML = `<div class="p-8">${emptyState("Belum ada riwayat scan", "radar")}</div>`;
  } else {
    table.innerHTML = `
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-100">
            <tr>
              <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Website</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Mode</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Score</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Status</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Tanggal</th>
              <th class="px-5 py-3"></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-50">
            ${scans.slice(0,8).map(sc => `
              <tr class="hover:bg-slate-50 transition">
                <td class="px-5 py-3.5 font-medium text-slate-900">Scan #${sc.id}</td>
                <td class="px-5 py-3.5 text-slate-500 uppercase text-xs">${sc.mode}</td>
                <td class="px-5 py-3.5">
                  ${sc.security_score !== null ? `<span class="font-bold ${scoreColor(sc.security_score)}">${sc.security_score.toFixed(1)}</span>` : "–"}
                  ${sc.grade ? `<span class="ml-1 text-xs text-slate-400">(${sc.grade})</span>` : ""}
                </td>
                <td class="px-5 py-3.5">${statusBadge(sc.status)}</td>
                <td class="px-5 py-3.5 text-slate-500 text-xs">${formatDate(sc.created_at)}</td>
                <td class="px-5 py-3.5">
                  <a href="../report/index.html?scan_id=${sc.id}" class="text-xs text-slate-500 hover:text-slate-900 font-medium">
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 inline"></i>
                  </a>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }
  lucide.createIcons();
}

function statCard(title, value, sub, icon, valueClass = "text-slate-900") {
  return `
    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
      <div class="flex items-start justify-between mb-3">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">${title}</p>
        <div class="w-8 h-8 bg-slate-100 rounded-xl flex items-center justify-center">
          <i data-lucide="${icon}" class="w-4 h-4 text-slate-600"></i>
        </div>
      </div>
      <p class="text-3xl font-bold ${valueClass}">${value}</p>
      <p class="text-xs text-slate-500 mt-1">${sub}</p>
    </div>`;
}

function miniCard(label, value, bgBorder, textClass) {
  return `
    <div class="border ${bgBorder} rounded-xl p-3 text-center">
      <p class="text-xl font-bold ${textClass}">${value}</p>
      <p class="text-xs text-slate-500 font-medium mt-0.5">${label}</p>
    </div>`;
}

function emptyState(msg, icon = "inbox") {
  return `
    <div class="flex flex-col items-center justify-center py-8 text-slate-400">
      <i data-lucide="${icon}" class="w-10 h-10 mb-3 opacity-30"></i>
      <p class="text-sm">${msg}</p>
    </div>`;
}

loadDashboard();
</script>
</body>
</html>
